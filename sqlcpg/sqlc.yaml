version: "2"
plugins:
  - name: "sqlc_gen_dynamic"
    wasm:
      url: "https://github.com/JNinng/sqlc_gen_dynamic/releases/download/v0.1.2/sqlc_gen_dynamic-v0.1.2.wasm"
      sha256: "8a98dac672fbcf64d4a25ac344bc52e9aaab8f0550f4c3a0725dd4f46b690344"
    env:
      - "DYNQ_DUMP_REQUEST"
sql:
  - engine: "postgresql"
    schema:
      - "schema.sql"
      - "rls.sql"
      - "operate.sql"
      - "expose.sql"
    queries: "queries.sql"
    gen:
      go:
        package: "gen"
        out: "gen"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_db_tags: true
        emit_pointers_for_null_types: true
        emit_interface: true

  - engine: "postgresql"
    schema:
      - "schema.sql"
      - "rls.sql"
      - "operate.sql"
      - "expose.sql"
    queries: "queries.sql"
    codegen:
      - plugin: "sqlc_gen_dynamic"
        out: "gen"
        options:
          package: "gen"
          runtime_import: "github.com/jninng/sqlc_gen_dynamic/dynq"
          schema: "public"
          default_ops: "none"
          page_default: 20
          page_max: 200

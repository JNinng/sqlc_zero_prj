version: "2"
plugins:
  - name: "sqlc_gen_dynamic"
    wasm:
      url: "https://github.com/JNinng/sqlc_gen_dynamic/releases/download/v0.1.1/sqlc_gen_dynamic-v0.1.1.wasm"
      sha256: "e6e499c85a5b1d5d0c8bab5febb39d8b619997e102031f6bb5f801474ad7f1a7"
    env:
      - "DYNQ_DUMP_REQUEST"
sql:
  - engine: "postgresql"
    schema: "schema.sql"
    queries: "queries.sql"
    gen:
      go:
        package: "gen"
        out: "gen"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_db_tags: true
        emit_pointers_for_null_types: true
        emit_interface: true

  - engine: "postgresql"
    schema: "schema.sql"
    queries: "queries.sql"
    codegen:
      - plugin: "sqlc_gen_dynamic"
        out: "gen"
        options:
          package: "gen"
          runtime_import: "github.com/jninng/sqlc_gen_dynamic/dynq"
          schema: "public"
          default_ops: "none"
          page_default: 20
          page_max: 200
